name: ci

# Runs on pull requests, with no AWS access at all. A broken build should be
# caught before the deploy workflow ever gets a chance to assume a role.

on:
  pull_request:
  push:
    branches-ignore: [main] # main is covered by deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check the build produced what we expect
        run: |
          set -euo pipefail
          for path in index.html 404.html pipeline/index.html resume/index.html projects/index.html sitemap-index.xml; do
            if [ ! -f "public/${path}" ]; then
              echo "::error::public/${path} missing from the build output"
              exit 1
            fi
          done
          echo "All expected pages present."
